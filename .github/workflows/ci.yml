name: API quality and container
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p output/evidence
      - run: python -m unittest discover -s tests -v 2>&1 | tee output/evidence/backend-tests.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check frontend/app.js
      - run: node --test tests/frontend.test.cjs | tee output/evidence/frontend-tests.txt
      - run: python tools/verify_flow.py
      - run: docker build -t alertario:test .
      - run: |
          docker run -d --name alertario -p 8080:8080 alertario:test
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8080/api/health && curl --fail http://localhost:8080/ && curl --fail http://localhost:8080/charts.js; then exit 0; fi
            sleep 1
          done
          docker logs alertario
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-python-${{ matrix.python }}
          path: output/evidence/
